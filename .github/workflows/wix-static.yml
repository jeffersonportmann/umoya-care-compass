name: Publish uMoya static website to Wix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umoya-wix-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: wix-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test static deployment safeguards
        run: node --test scripts/static-policy.test.mjs
      - name: Build the website
        run: npm run build
        env:
          VITE_STATIC_EXPORT: 'true'
      - name: Render every page and export published Wix articles
        run: node scripts/export-static.mjs
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_BLOG_CONNECTION_KEY }}
      - name: Upload and release the complete static site
        run: node scripts/upload-wix.mjs
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_BLOG_CONNECTION_KEY }}